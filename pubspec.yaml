name: comica
description: A beautiful Material 3 comic reader for Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # PDF Rendering
  pdfx: ^2.7.0

  # File System
  file_picker: ^8.1.2
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI & Design
  google_fonts: ^6.2.1
  dynamic_color: ^1.7.0
  animations: ^2.0.11
  shimmer: ^3.0.0
  photo_view: ^0.15.0

  # Utils
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
